; Matrix Weather Clock
;   seengreat_hub75_s3: Seengreat RGB Matrix HUB75 S3 (ESP32-S3-WROOM-1-N16R8) + 64x32 HUB75 panel
;   guition_lcd4848:    Guition ESP32-4848S040 4-inch 480x480 ST7701 LCD (ESP32-S3, 16 MB flash, 8 MB PSRAM)
[platformio]
default_envs = seengreat_hub75_s3
src_dir = src
include_dir = include

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; 16 MB QIO flash + 8 MB octal PSRAM (both boards)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/mwc_16MB.csv
board_build.filesystem = littlefs

build_flags =
  -D BOARD_HAS_PSRAM
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=0    ; keep async_tcp off the render core
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D ARDUINO_LOOP_STACK_SIZE=12288
  -D CORE_DEBUG_LEVEL=2
  -D MWC_VERSION=\"0.18.0\"
  -Wall -Wno-unused-parameter

lib_deps =
  adafruit/Adafruit GFX Library @ ^1.12.1
  adafruit/Adafruit BusIO @ ^1.17.0
  ESP32Async/ESPAsyncWebServer @ ^3.9.0
  ESP32Async/AsyncTCP @ ^3.4.0
  bblanchon/ArduinoJson @ ^7.4.0
  knolleary/PubSubClient @ ^2.8
  bitbank2/PNGdec @ ^1.1.6
  ; framework libraries listed explicitly so the dependency finder never misses them
  WiFi
  Network
  NetworkClientSecure
  HTTPClient
  ESPmDNS
  DNSServer
  Update
  LittleFS
  Wire
  ESP_I2S

extra_scripts =
  pre:tools/build_web.py

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

[env:seengreat_hub75_s3]
extends = common
build_flags =
  ${common.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1          ; native USB (ARDUINO_USB_MODE=1 comes from the board definition)
  -D S3_LCD_DIV_NUM=20                  ; HUB75 library: 160 MHz / 20 = 8 MHz panel clock (WiFi coexistence)
  -D NO_CIE1931                         ; we apply our own runtime gamma LUT (avoid double gamma)
  ;-D SPIRAM_DMA_BUFFER                 ; opt-in only: move the HUB75 framebuffer to PSRAM (caps clock at 13 MHz)
lib_deps =
  https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7 ; 3.0.14
  ${common.lib_deps}

; The 4-inch LCD board reaches USB through a CH340 on UART0 (GPIO 19/20 carry touch and LCD data), so the
; console stays on UART0. The CH340 drops bytes at 921600 baud; upload at 460800.
[env:guition_lcd4848]
extends = common
build_flags =
  ${common.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D MWC_BOARD_LCD4848
upload_speed = 460800
